  <style>
    body {
      font-family: 'Segoe UI', sans-serif;

    h1 {
      color: #333;
    }

    #result {
      font-size: 1.5em;
      margin-top: 20px;
      padding: 10px;
      border: 2px dashed #ccc;
      min-height: 60px;
      background: white;
    }

    #start-btn {
      padding: 10px 20px;
      font-size: 1.2em;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    #start-btn:hover {
      background-color: #45a049;
    }
  </style>

<body>

  <h1>🎤 Voice Command Demo</h1>



  <button id="start-btn">Start Listening</button>
  <div id="result">Your speech will appear here...</div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const resultDiv = document.getElementById('result');

    // Check if browser supports the Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      resultDiv.textContent = "Sorry, your browser does not support Speech Recognition.";
      startBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      startBtn.addEventListener('click', () => {
        recognition.start();
        resultDiv.textContent = "Listening...";
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase().trim();
        resultDiv.textContent = `You said: "${transcript}"`;
        handleCommand(transcript);
      };

      recognition.onerror = (event) => {
        resultDiv.textContent = 'Error occurred in recognition: ' + event.error;
      };

      function handleCommand(command) {
        if (command.includes("change background")) {
          document.body.style.backgroundColor = getRandomColor();
        } else if (command.includes("hello")) {
          alert("Hello! How can I help you?");
        } else if (command.includes("stop listening")) {
          recognition.stop();
          resultDiv.textContent = "Stopped listening.";
        }
      }

      function getRandomColor() {
        const colors = ["#FFC0CB", "#ADD8E6", "#90EE90", "#FFFACD", "#FFB6C1"];
        return colors[Math.floor(Math.random() * colors.length)];
      }
    }

    if ('speechSynthesis' in window) {
	        // Speech synthesis is supported
	    } else {
	        console.warn("Speech synthesis not supported in this browser.");
    }
