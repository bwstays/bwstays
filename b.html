<!DOCTYPE html>
<html>
<head>
    <title>KML Map Display</title>

     <script  type="text/javascript"
	        src="https://maps.googleapis.com/maps/api/js?v=3.exp&key=AIzaSyCvYg5kdXSgMv3NfO7UK2oZqNPE7P30rbk&sensor=false&libraries=places"
         ></script>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        function initialize() {
            var mapOptions = {
                center: new google.maps.LatLng( 11.542442317568533, 76.02721621504702), // Example coordinates
                zoom: 10,
                mapTypeId: google.maps.MapTypeId.ROADMAP
            };
            var map = new google.maps.Map(document.getElementById('map'), mapOptions);

            var kmlLayer = new google.maps.KmlLayer({
                url: 'locations.kml' // Replace with the actual path to your KML file
            });
            kmlLayer.setMap(map);
        }
        google.maps.event.addDomListener(window, 'load', initialize);
    </script>
</body>
</html>
