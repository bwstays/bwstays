<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenLayers KML Example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <style>
        .map {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
    <div id="map" class="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <script>
        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM() // OpenStreetMap base layer
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([11.542442317568533, 76.02721621504702]), // Example: kalpetta coordinates
                zoom: 10
            })
        });

        // Create a KML layer
        const kmlLayer = new ol.layer.Vector({
            source: new ol.source.Vector({
                url: 'locations.kml', // Replace with the actual path to your KML file
                format: new ol.format.KML()
            }),
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: 'blue',
                    width: 3
                }),
                fill: new ol.style.Fill({
                    color: 'rgba(0, 0, 255, 0.1)'
                })
            })
        });

        // Add the KML layer to the map
        map.addLayer(kmlLayer);
        map.getView().fit(kmlLayer.getExtent(), {constrainResolution: false});
    </script>
</body>
</html>
