<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.title">My Website</title>

    <style>
    .lang-transition {
	    animation: fadeContent 0.3s ease-in-out;
	}

	@keyframes fadeContent {
	    0%, 100% { opacity: 1; }
	    50% { opacity: 0.5; }
	}

	.language-switcher {
	    position: fixed;
	    top: 20px;
	    right: 20px;
	    z-index: 1000;
	}

	.lang-option {
	    margin: 0 5px;
	    padding: 8px 15px;
	    border: 2px solid #333;
	    background: white;
	    cursor: pointer;
	}

	.lang-option.active {
	    background: #333;
	    color: white;
}
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="language-switcher">
        <button class="lang-option active" data-lang="en">EN</button>
        <button class="lang-option" data-lang="es">ES</button>
        <button class="lang-option" data-lang="fr">FR</button>
        <button class="lang-option" data-lang="de">DE</button>
    </div>

    <!-- Content with data-i18n attributes -->
    <nav>
        <a href="#" data-i18n="nav.home">Home</a>
        <a href="#" data-i18n="nav.about">About</a>
        <a href="#" data-i18n="nav.contact">Contact</a>
    </nav>

    <section class="hero">
        <h1 data-i18n="hero.title">Welcome</h1>
        <p data-i18n="hero.subtitle">Your success is our mission</p>
    </section>

    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"
    ></script>
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"
    ></script>

    <script src="js/language.js"></script>
    <script src="js/translations.js"></script>


</body>
</html>
