<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BWStays - Search Implementation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 20px 60px 20px 25px;
            font-size: 18px;
            border: 3px solid #e0e0e0;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            background: white;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .search-results {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .results-count {
            color: #666;
            font-size: 16px;
        }

        .sort-dropdown {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .result-item {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
        }

        .result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .result-title {
            color: #333;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .result-title:hover {
            color: #667eea;
        }

        .result-type {
            display: inline-block;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .result-content {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .result-meta {
            display: flex;
            gap: 20px;
            color: #999;
            font-size: 14px;
        }

        .highlight {
            background: linear-gradient(45deg, #fff3cd, #ffeaa7);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .search-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .search-input {
                padding: 15px 50px 15px 20px;
                font-size: 16px;
            }

            .filters {
                gap: 10px;
            }

            .filter-btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .results-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .result-meta {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="header">
            <h1>BWStays Search</h1>
            <p>Discover comfortable and affordable short-term stays in Kerala</p>
        </div>

        <div class="search-box">
            <input type="text"
                   class="search-input"
                   id="searchInput"
                   placeholder="Search for stays, locations, amenities..."
                   autocomplete="off">
            <button class="search-btn" id="searchBtn">??</button>
        </div>

        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="properties">Properties</button>
            <button class="filter-btn" data-filter="locations">Locations</button>
            <button class="filter-btn" data-filter="amenities">Amenities</button>
            <button class="filter-btn" data-filter="experiences">Experiences</button>
        </div>

        <div class="search-results" id="searchResults" style="display: none;">
            <div class="results-header">
                <span class="results-count" id="resultsCount"></span>
                <select class="sort-dropdown" id="sortDropdown">
                    <option value="relevance">Sort by Relevance</option>
                    <option value="alphabetical">Alphabetical</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>
            <div id="resultsList"></div>
        </div>
    </div>


    <script src="data/sitedata.js"></script>

  <script >
         class BWStaysSearch {
            constructor() {
                this.data = this.flattenJson(siteData);
                console.log(  this.data);
                this.filteredData = this.data;
                this.currentFilter = 'all';
                this.currentSort = 'relevance';
                this.searchQuery = '';
                this.isLoading = false;

                this.init();
            }

            init() {
                this.bindEvents();
                this.showInitialMessage();
            }

			flattenJson(obj) {
			   let result = [];
			   for (const key1 in obj)
			   {
					var obj2=obj[key1];
					for (const key2 in obj2)
					{
						 if (typeof obj2[key2] === 'object' && obj[key2] !== null && !Array.isArray(obj[key2]))
						 {
							  result.push( obj2[key2] );
						 }
					 }
			   }
			   return result;
			 }

            bindEvents() {
                const searchInput = document.getElementById('searchInput');
                const searchBtn = document.getElementById('searchBtn');
                const filters = document.getElementById('filters');
                const sortDropdown = document.getElementById('sortDropdown');

                // Search input events
                searchInput.addEventListener('input', this.debounce((e) => {
                    this.searchQuery = e.target.value.trim();
                    if (this.searchQuery) {
                        this.performSearch();
                    } else {
                        this.hideResults();
                    }
                }, 300));

                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.performSearch();
                    }
                });

                // Search button
                searchBtn.addEventListener('click', () => {
                    this.performSearch();
                });

                // Filter buttons
                filters.addEventListener('click', (e) => {
                    if (e.target.classList.contains('filter-btn')) {
                        this.setActiveFilter(e.target);
                        this.currentFilter = e.target.dataset.filter;
                        if (this.searchQuery) {
                            this.performSearch();
                        }
                    }
                });

                // Sort dropdown
                sortDropdown.addEventListener('change', (e) => {
                    this.currentSort = e.target.value;
                    if (this.filteredData.length > 0) {
                        this.sortResults();
                        this.renderResults();
                    }
                });
            }

            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            setActiveFilter(activeBtn) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                activeBtn.classList.add('active');
            }

            performSearch() {
                if (!this.searchQuery) {
                    this.hideResults();
                    return;
                }

                this.showLoading();

                // Simulate API delay
                setTimeout(() => {
                    this.searchData();
                    this.sortResults();
                    this.renderResults();
                }, 500);
            }

            searchData() {
                let results = this.data;

                // Apply text search
                if (this.searchQuery) {
                    const query = this.searchQuery.toLowerCase();
                    results = results.filter(item => {
                        const searchableText = [
                            item.description,
                            item.name,
                             ...item.amenities,
                            ...item.tags
                        ].join(' ').toLowerCase();

                        return searchableText.includes(query);
                    });
                }

                // Apply filter
                if (this.currentFilter !== 'all') {
                    results = results.filter(item => item.type === this.currentFilter);
                }

                this.filteredData = results;
            }

            sortResults() {
                switch (this.currentSort) {
                    case 'alphabetical':
                        this.filteredData.sort((a, b) => a.title.localeCompare(b.title));
                        break;

                    case 'relevance':
                    default:
                        // Keep original relevance order or implement relevance scoring
                        break;
                }
            }

            renderResults() {
                const resultsContainer = document.getElementById('searchResults');
                const resultsCount = document.getElementById('resultsCount');
                const resultsList = document.getElementById('resultsList');

                if (this.filteredData.length === 0) {
                    this.showNoResults();
                    return;
                }

                // Update results count
                resultsCount.textContent = `${this.filteredData.length} result${this.filteredData.length !== 1 ? 's' : ''} found`;

                // Render results
                resultsList.innerHTML = this.filteredData.map(item => this.createResultHTML(item)).join('');

                // Show results container
                resultsContainer.style.display = 'block';
            }

            createResultHTML(item) {
                const highlightedTitle = this.highlightSearchTerms(item.description);
                const highlightedContent = this.highlightSearchTerms(item.name);


                return `
                    <div class="result-item" data-id="${item.id}">
                        <div class="result-type">${this.formatType(item.type)}</div>
                        <h3 class="result-title">${highlightedTitle}</h3>
                        <div class="result-content"><a  href=" ${item.knowmore}" target="_blank" rel="noopener noreferrer nofollow" > ${highlightedContent}</a></div>


                    </div>
                `;
            }

            formatType(type) {
                const typeMap = {
                    'properties': 'Property',
                    'locations': 'Location',
                    'amenities': 'Amenity',
                    'experiences': 'Experience'
                };
                return typeMap[type] || type;
            }

            highlightSearchTerms(text) {
                if (!this.searchQuery) return text;

                 const regex = new RegExp(`(${this.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                return text.replace(regex, '<span class="highlight">$1</span>');
            }

            showLoading() {
                const resultsList = document.getElementById('resultsList');
                const resultsContainer = document.getElementById('searchResults');

                resultsList.innerHTML = '<div class="loading">Searching BWStays...</div>';
                resultsContainer.style.display = 'block';
            }

            showNoResults() {
                const resultsList = document.getElementById('resultsList');
                const resultsContainer = document.getElementById('searchResults');
                const resultsCount = document.getElementById('resultsCount');

                resultsCount.textContent = 'No results found';
                resultsList.innerHTML = `
                    <div class="no-results">
                        <h3>No results found</h3>
                        <p>Try adjusting your search terms or filters</p>
                    </div>
                `;
                resultsContainer.style.display = 'block';
            }

            hideResults() {
                const resultsContainer = document.getElementById('searchResults');
                resultsContainer.style.display = 'none';
            }

            showInitialMessage() {
                // Could add welcome message or popular searches here
            }
        }

        // Initialize the search when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new BWStaysSearch();
        });

        // Add some sample interactions
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('result-title')) {
                const resultItem = e.target.closest('.result-item');
                const itemId = resultItem.dataset.id;
                console.log(`Navigate to item ${itemId}`);
                // In real implementation, this would navigate to the property/experience page
                alert(`This would navigate to the detailed page for item ${itemId}`);
            }
        });



    </script>
</body>
</html>
